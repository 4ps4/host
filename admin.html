<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>4PS4.PRO Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px),
                #08090d;
            background-size: 40px 40px;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 18, 25, .95);
            border: 1px solid #333;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 0 40px rgba(234,179,8,.08);
        }

        h1 {
            text-align: center;
            color: #eab308;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            background: #08090d;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #eab308;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #eab308;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #facc15;
        }

        #loginError {
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
        }

        #dashboard {
            display: none;
        }

        header {
            background: rgba(10,12,17,.95);
            border-bottom: 1px solid #222;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            color: #eab308;
            font-size: 24px;
            font-weight: 900;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-buttons button {
            width: auto;
            padding: 10px 16px;
        }

        .logout {
            background: #dc2626 !important;
            color: white !important;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: rgba(15,18,25,.95);
            border: 1px solid #252525;
            border-radius: 15px;
            padding: 22px;
        }

        .stat-title {
            color: #888;
            font-size: 14px;
        }

        .stat-number {
            margin-top: 8px;
            font-size: 35px;
            color: #eab308;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .panel {
            background: rgba(15,18,25,.95);
            border: 1px solid #252525;
            border-radius: 15px;
            padding: 22px;
        }

        .panel h2 {
            margin-top: 0;
            color: #eab308;
            font-size: 18px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }

        .count {
            color: #eab308;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #222;
        }

        th {
            color: #888;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .loading {
            color: #888;
        }

        .error-box {
            background: rgba(220,38,38,.12);
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .header-inner {
                flex-direction: column;
            }

            .header-buttons {
                width: 100%;
            }

            .header-buttons button {
                flex: 1;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .box {
                padding: 25px;
            }

        }

    </style>
</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen" class="login">

    <div class="box">

        <h1>4PS4.PRO</h1>

        <div class="subtitle">
            Admin Analytics
        </div>

        <form id="loginForm">

            <input
                id="email"
                type="email"
                placeholder="Admin email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

        <div id="loginError"></div>

    </div>

</div>



<!-- =========================
     DASHBOARD
========================= -->

<div id="dashboard">

    <header>

        <div class="header-inner">

            <div>

                <div class="logo">
                    4PS4.PRO
                </div>

                <div style="color:#777;">
                    Visitor Analytics
                </div>

            </div>


            <div class="header-buttons">

                <button onclick="loadDashboard()">
                    ↻ Refresh
                </button>

                <button
                    class="logout"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </div>

    </header>


    <div class="container">


        <div
            id="dashboardError"
            class="error-box"
        ></div>


        <!-- STATS -->

        <div class="stats">


            <div class="stat">

                <div class="stat-title">
                    Total Visits
                </div>

                <div
                    id="totalVisits"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Unique Visitors
                </div>

                <div
                    id="uniqueVisitors"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Today's Visits
                </div>

                <div
                    id="todayVisits"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    Countries
                </div>

                <div
                    id="countryCount"
                    class="stat-number"
                >
                    0
                </div>

            </div>

        </div>



        <!-- COUNTRY / DEVICE -->

        <div class="grid">


            <div class="panel">

                <h2>
                    🌍 Visitors by Country
                </h2>

                <div
                    id="countries"
                    class="loading"
                >
                    Loading...
                </div>

            </div>


            <div class="panel">

                <h2>
                    💻 Devices
                </h2>

                <div
                    id="devices"
                    class="loading"
                >
                    Loading...
                </div>

            </div>

        </div>



        <!-- BROWSER / OS -->

        <div class="grid">


            <div class="panel">

                <h2>
                    🌐 Browsers
                </h2>

                <div
                    id="browsers"
                    class="loading"
                >
                    Loading...
                </div>

            </div>


            <div class="panel">

                <h2>
                    🖥 Operating Systems
                </h2>

                <div
                    id="systems"
                    class="loading"
                >
                    Loading...
                </div>

            </div>

        </div>



        <!-- RECENT VISITORS -->

        <div class="panel">

            <h2>
                👥 Recent Visitors
            </h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Time</th>
                            <th>Country</th>
                            <th>City</th>
                            <th>Device</th>
                            <th>Browser</th>
                            <th>OS</th>
                            <th>Screen</th>
                            <th>Page</th>

                        </tr>

                    </thead>

                    <tbody
                        id="visitorTable"
                    ></tbody>

                </table>

            </div>

        </div>


    </div>

</div>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://xgzfmoqxbzbxxwhnpbuv.supabase.co";


const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnemZtb3F4YnpieHh3aG5wYnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODg3MjQsImV4cCI6MjEwNTc2NDcyNH0.Fi8WYHlvM-b0WdfglWyFZeyJ9UKXu1QfUJCaWJRKZDA";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =========================
   LOGIN
========================= */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value;


            const password =
                document
                    .getElementById("password")
                    .value;


            document
                .getElementById("loginError")
                .textContent =
                "Logging in...";


            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


            if (error) {

                document
                    .getElementById("loginError")
                    .textContent =
                    error.message;

                return;
            }


            document
                .getElementById("loginError")
                .textContent = "";


            showDashboard();

        }
    );



/* =========================
   CHECK SESSION
========================= */

async function checkLogin() {

    const {
        data
    } =
        await supabaseClient.auth
            .getSession();


    if (
        data &&
        data.session
    ) {

        showDashboard();

    }

}



/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard() {

    document
        .getElementById("loginScreen")
        .style.display =
        "none";


    document
        .getElementById("dashboard")
        .style.display =
        "block";


    loadDashboard();

}



/* =========================
   LOGOUT
========================= */

async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

}



/* =========================
   DASHBOARD ERROR
========================= */

function showError(message) {

    const box =
        document.getElementById(
            "dashboardError"
        );

    box.textContent =
        message;

    box.style.display =
        "block";

}



/* =========================
   LOAD DATA
========================= */

async function loadDashboard() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("visits")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            showError(
                "Could not load visits: " +
                error.message
            );

            console.error(error);

            return;
        }


        document
            .getElementById(
                "dashboardError"
            )
            .style.display =
            "none";


        updateStats(data);

        updateCountries(data);

        updateDevices(data);

        updateBrowsers(data);

        updateSystems(data);

        updateTable(data);


    } catch (error) {

        showError(
            "Dashboard error: " +
            error.message
        );

        console.error(error);

    }

}



/* =========================
   STATS
========================= */

function updateStats(data) {

    document
        .getElementById("totalVisits")
        .textContent =
        data.length;


    const unique =
        new Set(
            data
                .map(row => row.visitor_id)
                .filter(Boolean)
        );


    document
        .getElementById("uniqueVisitors")
        .textContent =
        unique.size;


    const now =
        new Date();


    const today =
        data.filter(row => {

            const date =
                new Date(
                    row.created_at
                );


            return (
                date.getFullYear() ===
                now.getFullYear()

                &&

                date.getMonth() ===
                now.getMonth()

                &&

                date.getDate() ===
                now.getDate()
            );

        });


    document
        .getElementById("todayVisits")
        .textContent =
        today.length;


    const countries =
        new Set(
            data
                .map(row => row.country)
                .filter(Boolean)
        );


    document
        .getElementById("countryCount")
        .textContent =
        countries.size;

}



/* =========================
   COUNT VALUES
========================= */

function countValues(
    data,
    field
) {

    const counts = {};


    data.forEach(row => {

        const value =
            row[field] ||
            "Unknown";


        counts[value] =
            (counts[value] || 0) + 1;

    });


    return Object
        .entries(counts)
        .sort(
            (a, b) =>
                b[1] - a[1]
        );

}



/* =========================
   RENDER LIST
========================= */

function renderList(
    elementId,
    values
) {

    const element =
        document.getElementById(
            elementId
        );


    if (!values.length) {

        element.innerHTML =
            "No data yet.";

        return;
    }


    element.innerHTML =
        values
            .slice(0, 10)
            .map(item => {

                return `
                    <div class="row">

                        <span>
                            ${escapeHtml(item[0])}
                        </span>

                        <span class="count">
                            ${item[1]}
                        </span>

                    </div>
                `;

            })
            .join("");

}



/* =========================
   COUNTRY
========================= */

function updateCountries(data) {

    renderList(
        "countries",
        countValues(
            data,
            "country"
        )
    );

}



/* =========================
   DEVICE
========================= */

function updateDevices(data) {

    renderList(
        "devices",
        countValues(
            data,
            "device"
        )
    );

}



/* =========================
   BROWSER
========================= */

function updateBrowsers(data) {

    renderList(
        "browsers",
        countValues(
            data,
            "browser"
        )
    );

}



/* =========================
   OS
========================= */

function updateSystems(data) {

    renderList(
        "systems",
        countValues(
            data,
            "os"
        )
    );

}



/* =========================
   TABLE
========================= */

function updateTable(data) {

    const table =
        document.getElementById(
            "visitorTable"
        );


    if (!data.length) {

        table.innerHTML = `
            <tr>
                <td colspan="8">
                    No visitors yet.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML =
        data
            .slice(0, 100)
            .map(row => {

                const date =
                    new Date(
                        row.created_at
                    );


                return `
                    <tr>

                        <td>
                            ${escapeHtml(
                                date.toLocaleString()
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.country ||
                                "Unknown"
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.city ||
                                "Unknown"
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.device ||
                                "Unknown"
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.browser ||
                                "Unknown"
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.os ||
                                "Unknown"
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.screen ||
                                "Unknown"
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.page ||
                                "/"
                            )}
                        </td>

                    </tr>
                `;

            })
            .join("");

}



/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================
   START
========================= */

checkLogin();


/* Refresh every 30 seconds */

setInterval(
    function() {

        const dashboard =
            document.getElementById(
                "dashboard"
            );


        if (
            dashboard.style.display ===
            "block"
        ) {

            loadDashboard();

        }

    },
    30000
);


</script>

</body>
</html>
