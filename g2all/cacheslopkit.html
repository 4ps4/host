<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{font-family:'Rajdhani',sans-serif;background:#08090d;color:#fff;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;position:relative;padding:24px 16px;background-size:40px 40px;background-image:linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.03) 1px,transparent 1px)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.6;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%);background-size:100% 4px}
.ps4-bg{position:fixed;inset:0;pointer-events:none;opacity:.07;display:flex;align-items:center;justify-content:center;z-index:0}
.ps4-bg:before{content:"PS4";font-family:'Orbitron',sans-serif;font-size:min(42vw,520px);font-weight:900;color:#2563eb;filter:blur(3px)}
.panel{background:rgba(13,17,23,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 70px rgba(0,0,0,.45);position:relative;z-index:20}
header{width:100%;max-width:1024px;text-align:center}
.header-panel{padding:18px 20px;border-radius:18px;border-top:2px solid rgba(234,179,8,.55)}
#siteTitle{margin:0;font-family:'Orbitron',sans-serif;font-size:clamp(18px,3.2vw,32px);font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:transparent;background:linear-gradient(90deg,#facc15,#fef3c7,#eab308);background-clip:text;-webkit-background-clip:text}
.gold-line{height:4px;width:140px;margin:10px auto 0;border-radius:999px;background:linear-gradient(90deg,transparent,#eab308,transparent)}
main{width:100%;max-width:720px;flex:1;display:flex;align-items:center;justify-content:center}
.status-panel{width:100%;border-radius:22px;padding:42px 28px;text-align:center;border-top:2px solid rgba(234,179,8,.4)}
.badge{display:inline-block;padding:7px 15px;border-radius:999px;color:#facc15;background:rgba(113,63,18,.32);border:1px solid rgba(234,179,8,.35);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}
#msgs{margin:0;min-height:82px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:clamp(18px,3.3vw,30px);line-height:1.35;font-weight:900;color:#fff}
.loading{width:min(90%,460px);height:5px;margin:28px auto 0;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(234,179,8,.16)}
.loading:after{content:"";display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#854d0e,#eab308,#fef08a);box-shadow:0 0 18px rgba(234,179,8,.7);animation:loading 1.5s ease-in-out infinite}
@keyframes loading{0%{transform:translateX(-130%)}100%{transform:translateX(400%)}}
footer{width:100%;max-width:1024px;text-align:center}
.footer-panel{border-radius:14px;padding:12px;color:#9ca3af;font-size:14px}
.gold{color:#facc15;font-family:'Orbitron',sans-serif;font-weight:800;margin:0 4px}
@media(max-width:600px){body{padding:16px 10px}.status-panel{padding:34px 18px}.ps4-bg:before{font-size:300px}}

<body>

</header>

<main>

    <div class="badge">Offline Cache Installation</div>
    <h1 id="msgs">Starting Cache Installation...</h1>
    <div class="loading"></div>
  </section>
</main>

<footer>
  <div class="panel footer-panel">
    <span>Powered by</span>
    <span class="gold">4PS4.PRO</span>
    <span>| Thank Yasir Aliraqi</span>
  </div>
</footer>

<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
</script>
</body>
