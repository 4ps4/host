<!DOCTYPE html>
<html>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: 'Rajdhani', sans-serif;
    background: #08090d;
    color: #fff;
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    padding: 24px 16px;
    background-size: 40px 40px;
    background-image:
        linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
}

.orbitron { font-family: 'Orbitron', sans-serif; }
.fw-font { font-family: 'Share Tech Mono', monospace; }

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: .6;
    background: linear-gradient(
        rgba(18,16,16,0) 50%,

}

.ps4-bg {

    justify-content: center;

    z-index: 0;
}

.ps4-bg i {
    font-size: 500px;
    color: #2563eb;
    filter: blur(3px);
}

.glass-panel {
    background: rgba(13,17,23,.88);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 25px 70px rgba(0,0,0,.45);
    position: relative;
    z-index: 20;
}

header {
    width: 100%;
    max-width: 1024px;
    text-align: center;
}

.header-panel {
    padding: 18px 20px;
    border-radius: 18px;
    border-top: 2px solid rgba(234,179,8,.55);
}

#siteTitle {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(18px, 3.2vw, 32px);
    font-weight: 900;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: transparent;
    background: linear-gradient(
        90deg,
        #facc15,
        #fef3c7,
        #eab308
    );
    background-clip: text;
    -webkit-background-clip: text;
    text-shadow: 0 0 22px rgba(234,179,8,.18);
}

.gold-line {
    height: 4px;
    width: 140px;
    margin: 10px auto 0;
    border-radius: 999px;
    background: linear-gradient(
        90deg,
        transparent,
        #eab308,
        transparent
    );
}

main {
    width: 100%;
    max-width: 720px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.status-panel {
    width: 100%;
    border-radius: 22px;
    padding: 42px 28px;
    text-align: center;
    border-top: 2px solid rgba(234,179,8,.4);
}

.badge {
    display: inline-block;
    padding: 7px 15px;
    border-radius: 999px;
    color: #facc15;
    background: rgba(113,63,18,.32);
    border: 1px solid rgba(234,179,8,.35);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-bottom: 22px;
}

#msgs {
    margin: 0;
    min-height: 82px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(18px, 3.3vw, 30px);
    line-height: 1.35;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 16px rgba(255,255,255,.08);
}

.fw-info {
    margin-top: 22px;
    color: #9ca3af;
    font-size: 14px;
    letter-spacing: .08em;
}

.fw-value {
    color: #fde047;
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
}

.loading {
    width: min(90%, 460px);
    height: 5px;
    margin: 28px auto 0;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(234,179,8,.16);
}

.loading::after {
    content: "";
    display: block;
    width: 35%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(
        90deg,
        #854d0e,
        #eab308,
        #fef08a
    );
    box-shadow: 0 0 18px rgba(234,179,8,.7);
    animation: loading 1.5s ease-in-out infinite;
}

@keyframes loading {
    0% { transform: translateX(-130%); }
    100% { transform: translateX(400%); }
}

footer {
    width: 100%;
    max-width: 1024px;
    text-align: center;
}

.footer-panel {
    border-radius: 14px;
    padding: 12px;
    color: #9ca3af;
    font-size: 14px;
}

.gold {
    color: #facc15;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    margin: 0 4px;
}

@media (max-width: 600px) {
    body { padding: 16px 10px; }
    .status-panel { padding: 34px 18px; }
    .ps4-bg i { font-size: 300px; }
}
</style>

</head>

            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 13.52";
            });
        } else {
            if (window.applicationCache.status == '0') {
                if (fwNum == 5.05 || fwNum == 5.07) {
                    window.location.replace("cache505.html");
                } else if (fwNum >= 7.00 && fwNum <= 8.52) {
                    window.location.replace("cache700.html");
                } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    window.location.replace("cache900.html");
                } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    window.location.replace("cachecss.html");

                    window.location.replace("cacheslopkit.html");
                } else {
                    document.addEventListener("DOMContentLoaded", () => {
                        msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
                    });
                }
            } else {
                if (fwNum == 5.05 || fwNum == 5.07) {
                    var script = document.createElement('script');
                    script.src = "505/exploit.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 7.00 && fwNum <= 8.52) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "700/alert.js";

                }
                else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    var script = document.createElement('script');
                    script.type = 'module';

</html>
