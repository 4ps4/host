<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PS4 Exploit Host by 4PS4.PRO</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #08090d;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .fw-font {
            font-family: 'Share Tech Mono', monospace;
        }

        @keyframes jiggyBounce {
            0% {
                transform: scale(1) rotate(0deg);
                box-shadow:
                    0 0 15px rgba(234, 179, 8, 0.4),
                    inset 0 0 10px rgba(255, 255, 255, 0.2);
            }

            15% {
                transform: scale(1.08) rotate(-1.5deg);
                box-shadow:
                    0 0 30px rgba(234, 179, 8, 0.8),
                    inset 0 0 15px rgba(255, 255, 255, 0.4);
            }

            30% {
                transform: scale(0.96) rotate(1.5deg);
                box-shadow:
                    0 0 12px rgba(234, 179, 8, 0.3),
                    inset 0 0 5px rgba(255, 255, 255, 0.1);
            }

            45% {
                transform: scale(1.06) rotate(-1deg);
                box-shadow:
                    0 0 25px rgba(234, 179, 8, 0.7),
                    inset 0 0 12px rgba(255, 255, 255, 0.3);
            }

            60% {
                transform: scale(0.98) rotate(1deg);
                box-shadow:
                    0 0 15px rgba(234, 179, 8, 0.4),
                    inset 0 0 8px rgba(255, 255, 255, 0.2);
            }

            75% {
                transform: scale(1.04) rotate(-0.5deg);
                box-shadow:
                    0 0 22px rgba(234, 179, 8, 0.6),
                    inset 0 0 10px rgba(255, 255, 255, 0.25);
            }

            100% {
                transform: scale(1) rotate(0deg);
                box-shadow:
                    0 0 15px rgba(234, 179, 8, 0.4),
                    inset 0 0 10px rgba(255, 255, 255, 0.2);
            }
        }

        .jiggy-btn {
            animation: jiggyBounce 2.2s infinite ease-in-out;
            border: 2px solid #eab308;
            background:
                linear-gradient(
                    135deg,
                    #ca8a04 0%,
                    #a16207 50%,
                    #854d0e 100%
                );
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .jiggy-btn:hover {
            animation-play-state: paused;
            transform: scale(1.12) !important;
            box-shadow:
                0 0 40px #facc15,
                inset 0 0 20px #ffffff !important;
            background:
                linear-gradient(
                    135deg,
                    #eab308 0%,
                    #ca8a04 100%
                );
        }

        .scanlines {
            background:
                linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%
                );
            background-size: 100% 4px;
        }

        .cyber-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px
                );
        }

        .glass-panel {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown {
            min-width: 45px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .countdown-number {
            font-family: 'Share Tech Mono', monospace;
            color: #fef08a;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(250, 204, 21, 0.5);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 1.2rem;
            line-height: 1;
        }

        .launching {
            animation-play-state: paused !important;
            background:
                linear-gradient(
                    135deg,
                    #eab308 0%,
                    #ca8a04 100%
                ) !important;
            box-shadow:
                0 0 50px #facc15,
                inset 0 0 25px #ffffff !important;
        }
    </style>
</head>

<body
    class="relative flex flex-col justify-between items-center min-h-screen select-none cyber-grid px-4 py-6"
>

    <!-- CRT SCANLINES -->
    <div
        class="fixed inset-0 pointer-events-none scanlines z-10 opacity-60"
    ></div>

    <!-- PLAYSTATION BACKGROUND LOGO -->
    <div
        class="fixed inset-0 pointer-events-none opacity-10 flex items-center justify-center overflow-hidden"
    >
        <i
            class="fa-solid font-brands fa-playstation text-[500px] text-blue-500 blur-sm"
        ></i>
    </div>

    <!-- HEADER -->
    <header class="w-full max-w-4xl z-20 text-center mb-4">

        <div
            class="glass-panel rounded-2xl p-4 shadow-2xl border-t-2 border-yellow-500/50"
        >

            <h1
                id="msgs"
                class="orbitron text-xl sm:text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-200 to-yellow-500 tracking-wider uppercase transition-all duration-300"
            >
                PS4 Exploit Host by 4PS4.PRO
            </h1>

            <div
                class="h-1 w-32 bg-gradient-to-r from-transparent via-yellow-500 to-transparent mx-auto mt-2 rounded-full"
            ></div>

        </div>

    </header>

    <!-- MAIN MENU -->
    <main
        id="menu"
        class="w-full max-w-xl z-20 flex flex-col items-center justify-center flex-grow space-y-8 my-auto"
    >

        <div class="text-center space-y-2">

            <span
                class="inline-block px-3 py-1 text-xs font-bold uppercase tracking-widest text-yellow-400 bg-yellow-950/50 border border-yellow-500/30 rounded-full"
            >
                Select Firmware
            </span>

            <p class="text-xs text-gray-400">
                Click below to initiate auto-exploit payload
            </p>

        </div>

        <!-- JAILBREAK BUTTON -->
        <button
            id="jailbreakButton"
            class="jiggy-btn w-full sm:w-4/5 py-6 px-8 rounded-2xl text-white font-extrabold text-xl sm:text-2xl tracking-wider transition-all duration-200 cursor-pointer flex items-center justify-center space-x-3 sm:space-x-4 group shadow-2xl"
            onmouseover="updateMsg('PS4 GoldHEN Host for 5.05 and 7.00 to 13.52 FW - (Auto Exploit Selection)')"
            onmouseout="resetMsg()"
            onclick="triggerExploit('yasir/index.html')"
        >

            <i
                class="fa-solid fa-bolt text-yellow-300 text-2xl group-hover:animate-bounce"
            ></i>

            <span class="orbitron">
                Click here to Jailbreak!
            </span>

            <span
                class="fw-font text-yellow-200 text-lg sm:text-2xl bg-black/40 px-3 py-1 rounded-lg border border-yellow-400/40 tracking-widest shadow-inner"
            >
                7.00 - 13.52
            </span>

            <span class="countdown">
                <span
                    id="countdownNumber"
                    class="countdown-number"
                >
                    5
                </span>
            </span>

            <i
                class="fa-solid fa-bolt text-yellow-300 text-2xl group-hover:animate-bounce"
            ></i>

        </button>

    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-4xl z-20 text-center mt-6">

        <div
            class="glass-panel rounded-xl p-3 text-sm text-gray-400"
        >

            <span>
                Powered by
            </span>

            <span
                class="text-yellow-400 font-bold mx-1 orbitron"
            >
                4PS4.PRO
            </span>

            <span class="hidden sm:inline">
                | Thank Yasir Aliraqi
            </span>

        </div>

    </footer>


    <!-- =========================
         VISITOR TRACKING
    ========================== -->

    <script async src="https://custom-dashpal.lovable.app"></script>


    <!-- =========================
         MAIN JAVASCRIPT
    ========================== -->

    <script>

        const msgsElem =
            document.getElementById("msgs");

        const countdownElem =
            document.getElementById("countdownNumber");

        const jailbreakButton =
            document.getElementById("jailbreakButton");

        const defaultMsg =
            "PS4 Exploit Host by 4PS4.PRO";

        let exploitTriggered = false;

        let countdown = 5;

        let countdownTimer;


        /* =========================
           HEADER MESSAGE
        ========================= */

        function updateMsg(text) {

            if (!exploitTriggered) {
                msgsElem.innerHTML = text;
            }

        }


        function resetMsg() {

            if (!exploitTriggered) {
                msgsElem.innerHTML = defaultMsg;
            }

        }


        /* =========================
           EXPLOIT
        ========================= */

        function triggerExploit(path) {

            if (exploitTriggered) {
                return;
            }

            exploitTriggered = true;

            clearInterval(countdownTimer);

            jailbreakButton.classList.add("launching");

            countdownElem.innerHTML = "✓";

            msgsElem.innerHTML =
                "Launching GoldHEN Auto Exploit...";

            document.body.style.opacity = "0.7";

            setTimeout(function () {

                window.location.href = path;

            }, 300);

        }


        /* =========================
           COUNTDOWN
        ========================= */

        countdownTimer = setInterval(function () {

            if (exploitTriggered) {

                clearInterval(countdownTimer);

                return;
            }

            countdown--;

            countdownElem.innerHTML = countdown;

            if (countdown <= 0) {

                clearInterval(countdownTimer);

                countdownElem.innerHTML = "0";

                triggerExploit("yasir/index.html");

            }

        }, 1000);

    </script>

</body>
</html>
