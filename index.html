<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Exploit Host by 4PS4.PRO</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Added Tajawal & Cairo for clean Arabic styling -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #08090d;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Typography per language direction */
        html[dir="rtl"] body {
            font-family: 'Tajawal', sans-serif;
        }

        html[dir="rtl"] .orbitron {
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
        }

        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .fw-font {
            font-family: 'Share Tech Mono', monospace;
        }

        /* BO2 Jiggy Menu Style */
        @keyframes jiggyBounce {
            0% {
                transform: scale(1) rotate(0deg);
                box-shadow:
                    0 0 15px rgba(234, 179, 8, 0.4),
                    inset 0 0 10px rgba(255, 255, 255, 0.2);
            }

            15% {
                transform: scale(1.08) rotate(-1.5deg);
                box-shadow:
                    0 0 30px rgba(234, 179, 8, 0.8),
                    inset 0 0 15px rgba(255, 255, 255, 0.4);
            }

            30% {
                transform: scale(0.96) rotate(1.5deg);
                box-shadow:
                    0 0 12px rgba(234, 179, 8, 0.3),
                    inset 0 0 5px rgba(255, 255, 255, 0.1);
            }

            45% {
                transform: scale(1.06) rotate(-1deg);
                box-shadow:
                    0 0 25px rgba(234, 179, 8, 0.7),
                    inset 0 0 12px rgba(255, 255, 255, 0.3);
            }

            60% {
                transform: scale(0.98) rotate(1deg);
                box-shadow:
                    0 0 15px rgba(234, 179, 8, 0.4),
                    inset 0 0 8px rgba(255, 255, 255, 0.2);
            }

            75% {
                transform: scale(1.04) rotate(-0.5deg);
                box-shadow:
                    0 0 22px rgba(234, 179, 8, 0.6),
                    inset 0 0 10px rgba(255, 255, 255, 0.25);
            }

            100% {
                transform: scale(1) rotate(0deg);
                box-shadow:
                    0 0 15px rgba(234, 179, 8, 0.4),
                    inset 0 0 10px rgba(255, 255, 255, 0.2);
            }
        }

        .jiggy-btn {
            animation: jiggyBounce 2.2s infinite ease-in-out;

            border: 2px solid #eab308;

            background:
                linear-gradient(
                    135deg,
                    #ca8a04 0%,
                    #a16207 50%,
                    #854d0e 100%
                );

            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .jiggy-btn:hover {
            animation-play-state: paused;

            transform: scale(1.12) !important;

            box-shadow:
                0 0 40px #facc15,
                inset 0 0 20px #ffffff !important;

            background:
                linear-gradient(
                    135deg,
                    #eab308 0%,
                    #ca8a04 100%
                );
        }

        .scanlines {
            background:
                linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%
                );

            background-size: 100% 4px;
        }

        .cyber-grid {
            background-size: 40px 40px;

            background-image:
                linear-gradient(
                    to right,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px
                );
        }

        .glass-panel {
            background: rgba(13, 17, 23, 0.85);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Countdown styling */
        .countdown {
            min-width: 45px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .countdown-number {
            font-family: 'Share Tech Mono', monospace;
            color: #fef08a;

            background: rgba(0, 0, 0, 0.5);

            border: 1px solid rgba(250, 204, 21, 0.5);

            border-radius: 8px;

            padding: 4px 10px;

            font-size: 1.2rem;

            line-height: 1;
        }

        /* Launching state */
        .launching {
            animation-play-state: paused !important;

            background:
                linear-gradient(
                    135deg,
                    #eab308 0%,
                    #ca8a04 100%
                ) !important;

            box-shadow:
                0 0 50px #facc15,
                inset 0 0 25px #ffffff !important;
        }
    </style>
</head>

<body
    class="relative flex flex-col justify-between items-center min-h-screen select-none cyber-grid px-4 py-6"
>

    <!-- CRT Scanlines -->
    <div
        class="fixed inset-0 pointer-events-none scanlines z-10 opacity-60"
    ></div>

    <!-- PlayStation Background Logo -->
    <div
        class="fixed inset-0 pointer-events-none opacity-10 flex items-center justify-center overflow-hidden"
    >
        <i
            class="fa-solid font-brands fa-playstation text-[500px] text-blue-500 blur-sm"
        ></i>
    </div>

    <!-- HEADER -->
    <header class="w-full max-w-4xl z-20 text-center mb-4 relative">

        <!-- Language Switcher Button -->
        <div class="flex justify-end mb-3">
            <button
                id="langToggle"
                onclick="toggleLanguage()"
                class="glass-panel px-4 py-2 rounded-xl text-yellow-400 font-bold border border-yellow-500/40 hover:bg-yellow-500/20 transition-all flex items-center space-x-2 rtl:space-x-reverse cursor-pointer shadow-lg"
            >
                <i class="fa-solid fa-globe text-yellow-400"></i>
                <span id="langBtnText">العربية</span>
            </button>
        </div>

        <div
            class="glass-panel rounded-2xl p-4 shadow-2xl border-t-2 border-yellow-500/50"
        >

            <h1
                id="msgs"
                class="orbitron text-xl sm:text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-200 to-yellow-500 tracking-wider uppercase transition-all duration-300"
            >
                PS4 Exploit Host by 4PS4.PRO
            </h1>

            <div
                class="h-1 w-32 bg-gradient-to-r from-transparent via-yellow-500 to-transparent mx-auto mt-2 rounded-full"
            ></div>

        </div>

    </header>


    <!-- MAIN MENU -->
    <main
        id="menu"
        class="w-full max-w-xl z-20 flex flex-col items-center justify-center flex-grow space-y-8 my-auto"
    >

        <div class="text-center space-y-2">

            <span
                id="selectFwLabel"
                class="inline-block px-3 py-1 text-xs font-bold uppercase tracking-widest text-yellow-400 bg-yellow-950/50 border border-yellow-500/30 rounded-full"
            >
                Select Firmware
            </span>

            <p id="subInstruction" class="text-xs text-gray-400">
                Click below to initiate auto-exploit payload
            </p>

        </div>


        <!-- JAILBREAK BUTTON -->
        <button
            id="jailbreakButton"

            class="jiggy-btn w-full sm:w-4/5 py-6 px-8 rounded-2xl text-white font-extrabold text-xl sm:text-2xl tracking-wider transition-all duration-200 cursor-pointer flex items-center justify-center space-x-3 sm:space-x-4 rtl:space-x-reverse group shadow-2xl"

            onmouseover="updateHoverMsg()"

            onmouseout="resetMsg()"

            onclick="triggerExploit('yasir/index.html')"
        >

            <i
                class="fa-solid fa-bolt text-yellow-300 text-2xl group-hover:animate-bounce"
            ></i>


            <span id="btnText" class="orbitron">
                Click here to Jailbreak!
            </span>


            <span
                class="fw-font text-yellow-200 text-lg sm:text-2xl bg-black/40 px-3 py-1 rounded-lg border border-yellow-400/40 tracking-widest shadow-inner"
            >
                7.00 - 13.52
            </span>


            <!-- COUNTDOWN -->
            <span class="countdown">

                <span
                    id="countdownNumber"
                    class="countdown-number"
                >
                    5
                </span>

            </span>


            <i
                class="fa-solid fa-bolt text-yellow-300 text-2xl group-hover:animate-bounce"
            ></i>

        </button>

    </main>


    <!-- FOOTER -->
    <footer class="w-full max-w-4xl z-20 text-center mt-6">

        <div
            class="glass-panel rounded-xl p-3 text-sm text-gray-400"
        >

            <span id="footerPowered">Powered by</span>

            <span
                class="text-yellow-400 font-bold mx-1 orbitron"
            >
                4PS4.PRO
            </span>

            <span id="footerThanks" class="hidden sm:inline">
                | Thank Yasir Aliraqi
            </span>

        </div>

    </footer>


    <!-- JAVASCRIPT -->
    <script>

        /* =========================
           LOCALIZATION STRINGS
        ========================= */

        const i18n = {
            en: {
                defaultMsg: "PS4 Exploit Host by 4PS4.PRO",
                hoverMsg: "PS4 GoldHEN Host for 5.05 and 7.00 to 13.52 FW - (Auto Exploit Selection)",
                launchingMsg: "Launching GoldHEN Auto Exploit...",
                selectFw: "Select Firmware",
                subInstruction: "Click below to initiate auto-exploit payload",
                btnText: "Click here to Jailbreak!",
                footerPowered: "Powered by",
                footerThanks: "| Thank Yasir Aliraqi",
                langToggleBtn: "العربية"
            },
            ar: {
                defaultMsg: "مستضيف تهكير PS4 بواسطة 4PS4.PRO",
                hoverMsg: "مستضيف PS4 GoldHEN للتحديثات 5.05 و 7.00 إلى 13.52 - (تفعيل تلقائي)",
                launchingMsg: "جاري تشغيل GoldHEN التلقائي...",
                selectFw: "اختر النظام",
                subInstruction: "اضغط أدناه للبدء بالتفعيل التلقائي",
                btnText: "اضغط هنا للتهكير!",
                footerPowered: "بواسطة",
                footerThanks: "| شكراً ياسر العراقي",
                langToggleBtn: "English"
            }
        };

        /* ISO Country codes for Arabic-speaking countries */
        const arabicCountries = [
            'SA', 'AE', 'EG', 'IQ', 'KW', 'QA', 'BH', 'OM', 
            'JO', 'LB', 'SY', 'PS', 'YE', 'DZ', 'MA', 'TN', 
            'LY', 'SD', 'MR', 'SO', 'DJ', 'KM'
        ];

        let currentLang = localStorage.getItem('site_lang');


        /* =========================
           HISTORY HANDLING
        ========================= */

        try {

            var histlength = history.length;

            if (histlength > 1) {

                history.go(-histlength + 2);

            }

        } catch (e) {

            console.log("History state handled");

        }


        /* =========================
           VARIABLES
        ========================= */

        const msgsElem =
            document.getElementById("msgs");

        const countdownElem =
            document.getElementById("countdownNumber");

        const jailbreakButton =
            document.getElementById("jailbreakButton");


        let exploitTriggered = false;

        let countdown = 5;

        let countdownTimer;


        /* =========================
           LANGUAGE SWITCHER LOGIC
        ========================= */

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);

            const html = document.documentElement;
            html.setAttribute('lang', lang);
            html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            document.getElementById('langBtnText').innerText = i18n[lang].langToggleBtn;
            document.getElementById('selectFwLabel').innerText = i18n[lang].selectFw;
            document.getElementById('subInstruction').innerText = i18n[lang].subInstruction;
            document.getElementById('btnText').innerText = i18n[lang].btnText;
            document.getElementById('footerPowered').innerText = i18n[lang].footerPowered;
            document.getElementById('footerThanks').innerText = i18n[lang].footerThanks;

            if (!exploitTriggered) {
                msgsElem.innerHTML = i18n[lang].defaultMsg;
            } else {
                msgsElem.innerHTML = i18n[lang].launchingMsg;
            }
        }

        function toggleLanguage() {
            const newLang = currentLang === 'en' ? 'ar' : 'en';
            applyLanguage(newLang);
        }

        async function detectLanguage() {
            // 1. Check saved manual selection
            if (currentLang) {
                applyLanguage(currentLang);
                return;
            }

            // 2. Check browser languages array / preferred language
            const userLangs = navigator.languages || [navigator.language || navigator.userLanguage];
            const isArabicBrowser = userLangs.some(l => l && l.toLowerCase().startsWith('ar'));
            
            if (isArabicBrowser) {
                applyLanguage('ar');
                return;
            }

            // 3. Try primary GeoIP API (ipapi.co)
            try {
                const response = await fetch('https://ipapi.co/json/', { timeout: 3000 });
                const data = await response.json();
                
                if (data && arabicCountries.includes(data.country_code)) {
                    applyLanguage('ar');
                    return;
                }
            } catch (err) {
                console.log("Primary GeoIP check failed, trying fallback...");
            }

            // 4. Try secondary GeoIP API (ipwho.is) if primary fails
            try {
                const response2 = await fetch('https://ipwho.is/', { timeout: 3000 });
                const data2 = await response2.json();
                
                if (data2 && data2.success && arabicCountries.includes(data2.country_code)) {
                    applyLanguage('ar');
                    return;
                }
            } catch (err) {
                console.log("Secondary GeoIP check failed.");
            }

            // Default fallback
            applyLanguage('en');
        }


        /* =========================
           HEADER MESSAGE
        ========================= */

        function updateHoverMsg() {

            if (!exploitTriggered) {

                msgsElem.innerHTML = i18n[currentLang].hoverMsg;

            }

        }


        function resetMsg() {

            if (!exploitTriggered) {

                msgsElem.innerHTML = i18n[currentLang].defaultMsg;

            }

        }


        /* =========================
           EXPLOIT
        ========================= */

        function triggerExploit(path) {

            if (exploitTriggered) {

                return;

            }


            exploitTriggered = true;


            /* Stop countdown */

            clearInterval(countdownTimer);


            /* Change button */

            jailbreakButton.classList.add(
                "launching"
            );


            /* Update countdown */

            countdownElem.innerHTML =
                "✓";


            /* Update header */

            msgsElem.innerHTML = i18n[currentLang].launchingMsg;


            /* Dim page slightly */

            document.body.style.opacity =
                "0.7";


            /* Launch */

            setTimeout(function() {

                location.replace(path);

            }, 300);

        }


        /* =========================
           COUNTDOWN
        ========================= */

        countdownTimer = setInterval(function() {

            if (exploitTriggered) {

                clearInterval(countdownTimer);

                return;

            }


            countdown--;

            countdownElem.innerHTML =
                countdown;


            /* When countdown reaches zero */

            if (countdown <= 0) {

                clearInterval(countdownTimer);


                countdownElem.innerHTML =
                    "0";


                /* Automatically launch */

                triggerExploit(
                    "yasir/index.html"
                );

            }

        }, 1000);


        /* Initialize auto language detection on page load */
        detectLanguage();

    </script>

</body>
</html>
