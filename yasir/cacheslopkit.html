<!DOCTYPE html>
<html manifest="slopkit.manifest" lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 [5.05] 7.00 - 13.52 FW GoldHEN Host by 4PS4.PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{font-family:'Rajdhani',sans-serif;background:#08090d;color:#fff;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;position:relative;padding:24px 16px;background-size:40px 40px;background-image:linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.03) 1px,transparent 1px)}
html[dir="rtl"] body{font-family:'Tajawal',sans-serif}
html[dir="rtl"] .orbitron{font-family:'Cairo',sans-serif;font-weight:800}
.orbitron{font-family:'Orbitron',sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.6;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%);background-size:100% 4px}
.ps4-bg{position:fixed;inset:0;pointer-events:none;opacity:.07;display:flex;align-items:center;justify-content:center;z-index:0}
.ps4-bg:before{content:"PS4";font-family:'Orbitron',sans-serif;font-size:min(42vw,520px);font-weight:900;color:#2563eb;filter:blur(3px)}
.panel{background:rgba(13,17,23,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 70px rgba(0,0,0,.45);position:relative;z-index:20}
header{width:100%;max-width:1024px;text-align:center}
.lang-container{display:flex;justify-content:flex-end;margin-bottom:12px}
.lang-btn{background:rgba(13,17,23,.85);backdrop-filter:blur(12px);border:1px solid rgba(234,179,8,.4);color:#facc15;padding:8px 16px;border-radius:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.2s ease}
.lang-btn:hover{background:rgba(234,179,8,.2)}
.header-panel{padding:18px 20px;border-radius:18px;border-top:2px solid rgba(234,179,8,.55)}
#siteTitle{margin:0;font-size:clamp(18px,3.2vw,32px);font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:transparent;background:linear-gradient(90deg,#facc15,#fef3c7,#eab308);background-clip:text;-webkit-background-clip:text}
.gold-line{height:4px;width:140px;margin:10px auto 0;border-radius:999px;background:linear-gradient(90deg,transparent,#eab308,transparent)}
main{width:100%;max-width:720px;flex:1;display:flex;align-items:center;justify-content:center}
.status-panel{width:100%;border-radius:22px;padding:42px 28px;text-align:center;border-top:2px solid rgba(234,179,8,.4)}
.badge{display:inline-block;padding:7px 15px;border-radius:999px;color:#facc15;background:rgba(113,63,18,.32);border:1px solid rgba(234,179,8,.35);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}
#msgs{margin:0;min-height:82px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,3.3vw,30px);line-height:1.35;font-weight:900;color:#fff}
.loading{width:min(90%,460px);height:5px;margin:28px auto 0;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(234,179,8,.16)}
.loading:after{content:"";display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#854d0e,#eab308,#fef08a);box-shadow:0 0 18px rgba(234,179,8,.7);animation:loading 1.5s ease-in-out infinite}
@keyframes loading{0%{transform:translateX(-130%)}100%{transform:translateX(400%)}}
footer{width:100%;max-width:1024px;text-align:center}
.footer-panel{border-radius:14px;padding:12px;color:#9ca3af;font-size:14px}
.gold{color:#facc15;font-weight:800;margin:0 4px}
@media(max-width:600px){body{padding:16px 10px}.status-panel{padding:34px 18px}.ps4-bg:before{font-size:300px}}
</style>
</head>

<body>
<div class="ps4-bg"></div>

<header>
  <div class="lang-container">
    <button class="lang-btn" id="toggleBtn">
      <i class="fa-solid fa-globe"></i>
      <span id="langBtnText">العربية</span>
    </button>
  </div>
  <div class="panel header-panel">
    <h1 id="siteTitle" class="orbitron">PS4 Exploit Host by 4PS4.PRO</h1>
    <div class="gold-line"></div>
  </div>
</header>

<main>
  <section class="panel status-panel">
    <div id="badgeText" class="badge">Offline Cache Installation</div>
    <h1 id="msgs" class="orbitron">Starting Cache Installation...</h1>
    <div class="loading"></div>
  </section>
</main>

<footer>
  <div class="panel footer-panel">
    <span id="footerPowered">Powered by</span>
    <span class="gold orbitron">4PS4.PRO</span>
    <span id="footerThanks">| Thank Yasir Aliraqi</span>
  </div>
</footer>

<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);

var currentPercent = 0;
var cacheStatus = "installing";
var currentLang = "en";

const i18n = {
    en: {
        siteTitle: "PS4 Exploit Host by 4PS4.PRO",
        badgeText: "Offline Cache Installation",
        startingMsg: "Starting Cache Installation...",
        installingMsg: "Installing Offline Cache: ",
        successMsg: "Cache Installed Successfully ✔",
        reopenMsg: "Now Close And Re-Open Your Browser ...",
        errorMsg: "Error Installing Cache! - Clear and Re-Open Your Browser ...",
        footerPowered: "Powered by",
        footerThanks: "| Thank Yasir Aliraqi",
        langToggleBtn: "العربية"
    },
    ar: {
        siteTitle: "مستضيف تهكير PS4 بواسطة 4PS4.PRO",
        badgeText: "تثبيت التخزين المؤقت (أوفلاين)",
        startingMsg: "جاري البدء بتثبيت التخزين المؤقت...",
        installingMsg: "جاري تثبيت التخزين المؤقت: ",
        successMsg: "تم تثبيت التخزين المؤقت بنجاح ✔",
        reopenMsg: "الآن قم بإغلاق المتصفح وإعادة فتحه...",
        errorMsg: "خطأ في تثبيت التخزين المؤقت! - قم بمسح بيانات المتصفح وإعادة الفتح...",
        footerPowered: "بواسطة",
        footerThanks: "| شكراً ياسر العراقي",
        langToggleBtn: "English"
    }
};

const arabicCountries = ['SA','AE','EG','IQ','KW','QA','BH','OM','JO','LB','SY','PS','YE','DZ','MA','TN','LY','SD','MR','SO','DJ','KM'];

function updateStatusText() {
    var msgElem = document.getElementById("msgs");
    if(!msgElem) return;
    
    if (cacheStatus === "installing") {
        msgElem.innerHTML = currentPercent > 0 ? i18n[currentLang].installingMsg + currentPercent + "%" : i18n[currentLang].startingMsg;
    } else if (cacheStatus === "success") {
        msgElem.innerHTML = i18n[currentLang].successMsg;
    } else if (cacheStatus === "reopen") {
        msgElem.innerHTML = i18n[currentLang].reopenMsg;
    } else if (cacheStatus === "error") {
        msgElem.innerHTML = i18n[currentLang].errorMsg;
    }
}

function applyLanguage(lang) {
    currentLang = lang;
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

    document.getElementById('siteTitle').innerText = i18n[lang].siteTitle;
    document.getElementById('badgeText').innerText = i18n[lang].badgeText;
    document.getElementById('footerPowered').innerText = i18n[lang].footerPowered;
    document.getElementById('footerThanks').innerText = i18n[lang].footerThanks;
    document.getElementById('langBtnText').innerText = i18n[lang].langToggleBtn;
    
    updateStatusText();
}

document.getElementById('toggleBtn').onclick = function() {
    applyLanguage(currentLang === 'en' ? 'ar' : 'en');
};

function autoDetectCountry() {
    // 1. Check browser languages first
    var userLangs = navigator.languages || [navigator.language || navigator.userLanguage || ""];
    for(var i = 0; i < userLangs.length; i++) {
        if(userLangs[i] && userLangs[i].toLowerCase().indexOf('ar') === 0) {
            applyLanguage('ar');
            return;
        }
    }

    // 2. Query IP Geolocation
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://ipapi.co/json/', true);
    xhr.timeout = 2500;
    xhr.onload = function() {
        if (xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                if (data && arabicCountries.indexOf(data.country_code) !== -1) {
                    applyLanguage('ar');
                }
            } catch(e) {}
        }
    };
    xhr.send();
}

function DLProgress(e){
    currentPercent = Math.round(e.loaded / e.total * 100);
    cacheStatus = "installing";
    updateStatusText();
}

function DisplayCacheProgress(){
    cacheStatus = "success";
    updateStatusText();
    setTimeout(function(){
        cacheStatus = "reopen";
        updateStatusText();
    }, 1500);
}

if (window.applicationCache) {
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = DisplayCacheProgress;
    window.applicationCache.onupdateready = DisplayCacheProgress;
    window.applicationCache.onerror = function(){
        cacheStatus = "error";
        updateStatusText();
    };
}

autoDetectCountry();
</script>
</body>
</html>
