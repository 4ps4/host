<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 7.00 - 13.52 FW GoldHEN</title>

<!-- Fonts: Orbitron, Rajdhani, Share Tech Mono, Tajawal & Cairo for Arabic -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: 'Rajdhani', sans-serif;
    background: #08090d;
    color: #fff;
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    padding: 24px 16px;
    background-size: 40px 40px;
    background-image:
        linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
}

/* RTL Typography Overrides */
html[dir="rtl"] body {
    font-family: 'Tajawal', sans-serif;
}

html[dir="rtl"] .orbitron {
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
}

.orbitron { font-family: 'Orbitron', sans-serif; }
.fw-font { font-family: 'Share Tech Mono', monospace; }

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: .6;
    background: linear-gradient(
        rgba(18,16,16,0) 50%,
        rgba(0,0,0,.25) 50%
    );
    background-size: 100% 4px;
}

.ps4-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .09;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 0;
}

.ps4-bg i {
    font-size: 500px;
    color: #2563eb;
    filter: blur(3px);
}

.glass-panel {
    background: rgba(13,17,23,.88);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 25px 70px rgba(0,0,0,.45);
    position: relative;
    z-index: 20;
}

header {
    width: 100%;
    max-width: 1024px;
    text-align: center;
}

.lang-container {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
}

.lang-btn {
    background: rgba(13,17,23,.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(234,179,8,.4);
    color: #facc15;
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
}

.lang-btn:hover {
    background: rgba(234,179,8,.2);
}

.header-panel {
    padding: 18px 20px;
    border-radius: 18px;
    border-top: 2px solid rgba(234,179,8,.55);
}

#siteTitle {
    margin: 0;
    font-size: clamp(18px, 3.2vw, 32px);
    font-weight: 900;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: transparent;
    background: linear-gradient(
        90deg,
        #facc15,
        #fef3c7,
        #eab308
    );
    background-clip: text;
    -webkit-background-clip: text;
    text-shadow: 0 0 22px rgba(234,179,8,.18);
}

.gold-line {
    height: 4px;
    width: 140px;
    margin: 10px auto 0;
    border-radius: 999px;
    background: linear-gradient(
        90deg,
        transparent,
        #eab308,
        transparent
    );
}

main {
    width: 100%;
    max-width: 720px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.status-panel {
    width: 100%;
    border-radius: 22px;
    padding: 42px 28px;
    text-align: center;
    border-top: 2px solid rgba(234,179,8,.4);
}

.badge {
    display: inline-block;
    padding: 7px 15px;
    border-radius: 999px;
    color: #facc15;
    background: rgba(113,63,18,.32);
    border: 1px solid rgba(234,179,8,.35);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-bottom: 22px;
}

#msgs {
    margin: 0;
    min-height: 82px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 3.3vw, 30px);
    line-height: 1.35;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 16px rgba(255,255,255,.08);
}

.fw-info {
    margin-top: 22px;
    color: #9ca3af;
    font-size: 14px;
    letter-spacing: .08em;
}

.fw-value {
    color: #fde047;
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
}

.loading {
    width: min(90%, 460px);
    height: 5px;
    margin: 28px auto 0;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(234,179,8,.16);
}

.loading::after {
    content: "";
    display: block;
    width: 35%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(
        90deg,
        #854d0e,
        #eab308,
        #fef08a
    );
    box-shadow: 0 0 18px rgba(234,179,8,.7);
    animation: loading 1.5s ease-in-out infinite;
}

@keyframes loading {
    0% { transform: translateX(-130%); }
    100% { transform: translateX(400%); }
}

footer {
    width: 100%;
    max-width: 1024px;
    text-align: center;
}

.footer-panel {
    border-radius: 14px;
    padding: 12px;
    color: #9ca3af;
    font-size: 14px;
}

.gold {
    color: #facc15;
    font-weight: 800;
    margin: 0 4px;
}

@media (max-width: 600px) {
    body { padding: 16px 10px; }
    .status-panel { padding: 34px 18px; }
    .ps4-bg i { font-size: 300px; }
}
</style>
</head>

<body>
    <div class="scanlines"></div>

    <div class="ps4-bg">
        <i class="fa-solid fa-playstation"></i>
    </div>

    <header>
        <div class="lang-container">
            <button class="lang-btn" onclick="toggleLanguage()">
                <i class="fa-solid fa-globe"></i>
                <span id="langBtnText">العربية</span>
            </button>
        </div>
        <div class="glass-panel header-panel">
            <h1 id="siteTitle" class="orbitron">PS4 Exploit Host by 4PS4.PRO</h1>
            <div class="gold-line"></div>
        </div>
    </header>

    <main>
        <section class="glass-panel status-panel">
            <div id="badgeText" class="badge">GoldHEN Auto Exploit</div>

            <h1 id="msgs" class="orbitron">Loading GoldHEN v2.4b18.12... Please Wait</h1>

            <div class="fw-info">
                <span id="fwLabel">Detected Firmware:</span>
                <span id="fwDisplay" class="fw-value">Detecting...</span>
            </div>

            <div class="loading"></div>
        </section>
    </main>

    <footer>
        <div class="glass-panel footer-panel">
            <span id="footerPowered">Powered by</span>
            <span class="gold orbitron">4PS4.PRO</span>
            <span id="footerThanks">| Thank Yasir Aliraqi</span>
        </div>
    </footer>

    <script>
        const i18n = {
            en: {
                siteTitle: "PS4 Exploit Host by 4PS4.PRO",
                badgeText: "GoldHEN Auto Exploit",
                loadingMsg: "Loading GoldHEN v2.4b18.12... Please Wait",
                notFoundMsg: "Content not Found! - Clear Browser Data and Re-Install Cache ...",
                notPS4Msg: "Only for PS4 with Firmware 5.05 and 7.00 to 13.52",
                unsupportedMsg: "Unsupported Firmware: ",
                fwLabel: "Detected Firmware:",
                footerPowered: "Powered by",
                footerThanks: "| Thank Yasir Aliraqi",
                langToggleBtn: "العربية"
            },
            ar: {
                siteTitle: "مستضيف تهكير PS4 بواسطة 4PS4.PRO",
                badgeText: "تفعيل GoldHEN التلقائي",
                loadingMsg: "جاري تحميل GoldHEN v2.4b18.12... يرجى الانتظار",
                notFoundMsg: "المحتوى غير موجود! - يرجى مسح بيانات المتصفح وإعادة تثبيت التخزين المؤقت...",
                notPS4Msg: "مخصص فقط لجهاز PS4 بالتحديثات 5.05 ومن 7.00 إلى 13.52",
                unsupportedMsg: "نظام غير مدعوم: ",
                fwLabel: "النظام المكتشف:",
                footerPowered: "بواسطة",
                footerThanks: "| شكراً ياسر العراقي",
                langToggleBtn: "English"
            }
        };

        const arabicCountries = ['SA','AE','EG','IQ','KW','QA','BH','OM','JO','LB','SY','PS','YE','DZ','MA','TN','LY','SD','MR','SO','DJ','KM'];
        let currentLang = localStorage.getItem('site_lang');

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('site_lang', lang);
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            document.getElementById('siteTitle').innerText = i18n[lang].siteTitle;
            document.getElementById('badgeText').innerText = i18n[lang].badgeText;
            document.getElementById('fwLabel').innerText = i18n[lang].fwLabel;
            document.getElementById('footerPowered').innerText = i18n[lang].footerPowered;
            document.getElementById('footerThanks').innerText = i18n[lang].footerThanks;
            document.getElementById('langBtnText').innerText = i18n[lang].langToggleBtn;

            if (msgs.dataset.state === "notPS4") {
                msgs.innerHTML = i18n[lang].notPS4Msg;
            } else if (msgs.dataset.state === "error") {
                msgs.innerHTML = i18n[lang].notFoundMsg;
            } else if (msgs.dataset.state === "unsupported") {
                msgs.innerHTML = i18n[lang].unsupportedMsg + '<span style="color: red;">' + fwVersion + '</span>';
            } else if (!msgs.dataset.custom) {
                msgs.innerHTML = i18n[lang].loadingMsg;
            }
        }

        function toggleLanguage() {
            applyLanguage(currentLang === 'en' ? 'ar' : 'en');
        }

        async function detectLanguage() {
            if (currentLang) {
                applyLanguage(currentLang);
                return;
            }
            const userLangs = navigator.languages || [navigator.language || navigator.userLanguage];
            if (userLangs.some(l => l && l.toLowerCase().startsWith('ar'))) {
                applyLanguage('ar');
                return;
            }
            try {
                const res = await fetch('https://ipapi.co/json/', { timeout: 3000 });
                const data = await res.json();
                if (data && arabicCountries.includes(data.country_code)) {
                    applyLanguage('ar');
                    return;
                }
            } catch (e) {}

            try {
                const res2 = await fetch('https://ipwho.is/', { timeout: 3000 });
                const data2 = await res2.json();
                if (data2 && data2.success && arabicCountries.includes(data2.country_code)) {
                    applyLanguage('ar');
                    return;
                }
            } catch (e) {}

            applyLanguage('en');
        }

        /* Exploit Logic */
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        var fwDisplay = document.getElementById("fwDisplay");
        if (fwDisplay) {
            fwDisplay.textContent = fwVersion;
        }

        function onScriptError() {
            msgs.dataset.state = "error";
            msgs.innerHTML = i18n[currentLang || 'en'].notFoundMsg;
        }

        detectLanguage().then(() => {
            if (!isPS4) {
                msgs.dataset.state = "notPS4";
                msgs.innerHTML = i18n[currentLang].notPS4Msg;
            } else {
                if (window.applicationCache.status == '0') {
                    if (fwNum == 5.05 || fwNum == 5.07) {
                        window.location.replace("cache505.html");
                    } else if (fwNum >= 7.00 && fwNum <= 8.52) {
                        window.location.replace("cache700.html");
                    } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                        window.location.replace("cache900.html");
                    } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                        window.location.replace("cachecss.html");
                    } else if (fwNum >= 11.50 && fwNum <= 13.52) {
                        window.location.replace("cacheslopkit.html");
                    } else {
                        msgs.dataset.state = "unsupported";
                        msgs.innerHTML = i18n[currentLang].unsupportedMsg + '<span style="color: red;">' + fwVersion + '</span>';
                    }
                } else {
                    if (fwNum == 5.05 || fwNum == 5.07) {
                        var script = document.createElement('script');
                        script.src = "505/exploit.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 7.00 && fwNum <= 8.52) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "700/alert.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 9.00 && fwNum <= 9.60) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "900/alert.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 10.00 && fwNum <= 11.02) {
                        var script = document.createElement('script');
                        script.src = "css/main.js";
                        script.onerror = onScriptError;
                        script.onload = function () {
                            setTimeout(function () {
                                doJb();
                            }, 500);
                        };
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 11.50 && fwNum <= 12.02) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "slopkit/chain_lapse.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 12.50 && fwNum <= 13.00) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "slopkit/chain_poops.js";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                    else if (fwNum >= 13.02 && fwNum <= 13.52) {
                        var script = document.createElement('script');
                        script.type = 'module';
                        script.src = "slopkit/jb.js?v=10";
                        script.onerror = onScriptError;
                        document.head.appendChild(script);
                    }
                }
            }
        });
    </script>
</body>
</html>
